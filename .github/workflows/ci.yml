name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Shared with WpfFoundation; pinned to a commit so a change there can't break this build unannounced.
      # Literal colors, off-step spacing, and literal fonts or corner radii fail here; exceptions are in xaml-design-allowlist.txt.
      - name: XAML design check
        uses: gbolotin/WpfFoundation/.github/actions/xaml-design-check@222e37c4082b438e717820cec5c0545504931c79

      # The WPF visual tests size windows up to 1800 px, and Windows clamps windows to the screen.
      - name: Use a 1920x1080 display
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # A vX.Y.Z tag builds version X.Y.Z; every other build is <VersionPrefix>-ci.<run number>.
      - name: Choose version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag $env:GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]." }
            "property=-p:Version=$version" >> $env:GITHUB_OUTPUT
          } else {
            $version = dotnet msbuild src/DoViFixer.Domain/DoViFixer.Domain.csproj -getProperty:Version -p:VersionSuffix=ci.$env:GITHUB_RUN_NUMBER
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "property=-p:VersionSuffix=ci.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Always build against the pinned WpfFoundation package, never a local checkout.
      - name: Build
        run: dotnet build DoViFixer.sln -c Release -p:UseLocalWpfFoundation=false ${{ steps.version.outputs.property }}

      - name: Test
        run: dotnet test DoViFixer.sln -c Release --no-build -p:UseLocalWpfFoundation=false --filter "TestCategory!=NativeIntegration"

      # Framework-dependent: both apps need the .NET 10 Desktop Runtime.
      - name: Publish apps
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          foreach ($app in 'DoViFixer.App', 'DoViFixer.Console') {
            dotnet publish src/$app/$app.csproj -c Release --no-self-contained -p:UseLocalWpfFoundation=false ${{ steps.version.outputs.property }} -o out/$app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path out/$app/* -DestinationPath "out/$app-$version.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: out/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: out

      - name: Create GitHub release with the apps
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--title', $env:GITHUB_REF_NAME, '--generate-notes')
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $options += '--prerelease'
          }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out/*.zip).FullName @options
