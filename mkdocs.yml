# The user documentation at https://gbolotin.github.io/DoViFixer/. Help › Documentation (F1) in the app opens it.
# Build locally: pip install -r tools/docs-requirements.txt, then mkdocs serve.
# CI (.github/workflows/docs.yml) adds the screenshots from the WPF visual tests and publishes the site to GitHub Pages.
# English pages are <page>.md and are built at the site root; their Russian translations are <page>.ru.md, built under /ru/.
# The language selector in the header switches to the same page in the other language. Change both files together.
site_name: DoViFixer
site_description: Make Dolby Vision Profile 7 movies play right on Apple TV, NVIDIA Shield and Amazon Fire TV.
site_url: https://gbolotin.github.io/DoViFixer/
repo_url: https://github.com/gbolotin/DoViFixer
repo_name: gbolotin/DoViFixer
edit_uri: edit/main/docs-site/
docs_dir: docs-site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Features: features.md
  - Get started:
      - Install: install.md
      - Before you convert: before-you-convert.md
  - Using the app:
      - Add and scan movies: guide/scan.md
      - Convert: guide/convert.md
      - Backup and restore: guide/restore.md
      - Watch folder: guide/watch-folder.md
      - Settings: guide/settings.md
  - Learn:
      - How Dolby Vision works: dolby-vision.md
      - Streaming boxes: devices.md
  - More:
      - Command line and AI assistants: console.md
      - Troubleshooting: troubleshooting.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Чтобы фильмы с Dolby Vision Profile 7 правильно показывались на Apple TV, NVIDIA Shield и Amazon Fire TV.
          theme:
            palette:
              - toggle:
                  name: Включить тёмную тему
              - toggle:
                  name: Включить светлую тему
          nav_translations:
            Home: Главная
            Features: Возможности
            Get started: Начало работы
            Install: Установка
            Before you convert: Перед конвертацией
            Using the app: Работа с приложением
            Add and scan movies: Добавление и сканирование
            Convert: Конвертация
            Backup and restore: Резервная копия и восстановление
            Watch folder: Папка наблюдения
            Settings: Настройки
            Learn: Теория
            How Dolby Vision works: Как устроен Dolby Vision
            Streaming boxes: Приставки
            More: Ещё
            Command line and AI assistants: Командная строка и ИИ-ассистенты
            Troubleshooting: Решение проблем

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
