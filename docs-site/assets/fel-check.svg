<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Which Profile 7 files DoViFixer converts</title>
  <desc id="desc">Animation. A MEL file's enhancement layer is almost empty, so DoViFixer converts it. A Simple FEL file's enhancement layer holds picture data but adds no brightness; DoViFixer converts it only when you turn on Include Simple FEL conversion. A Complex FEL file's enhancement layer raises brightness above the base layer; DoViFixer skips it unless you turn on Allow Complex FEL conversion.</desc>
  <defs>
    <pattern id="chevrons" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="#ffa412"/>
      <path d="M-35 105 L35 35 L105 105 L175 35" fill="none" stroke="#ffb02e" stroke-width="30"/>
      <path d="M-35 175 L35 105 L105 175 L175 105" fill="none" stroke="#ffb02e" stroke-width="30"/>
      <path d="M-35 35 L35 -35 L105 35 L175 -35" fill="none" stroke="#ffb02e" stroke-width="30"/>
    </pattern>
    <filter id="textShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a3d00" flood-opacity="0.45"/>
    </filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="8" flood-color="#6b3200" flood-opacity="0.35"/>
    </filter></defs>
  <style>
    text { font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; font-style: italic; font-weight: 700; fill: #ffffff; }
    .big { font-size: 28px; } .mid { font-size: 22px; } .sub { font-size: 15px; } .small { font-size: 13px; }
    .tag { font-size: 14px; font-style: normal; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .grow { animation-name: grow; transform-box: fill-box; transform-origin: bottom; }
    .extra { animation-name: extra; } .verdict { animation-name: verdict; }
    @keyframes grow { 0.00% { transform: scaleY(0); } 12.00%, 92.00% { transform: scaleY(1); } 100.00% { transform: scaleY(0); } }
    @keyframes extra { 0.00%, 14.00% { opacity: 0; } 24.00%, 92.00% { opacity: 1; } 100.00% { opacity: 0; } }
    @keyframes verdict { 0.00%, 30.00% { opacity: 0; } 36.00%, 92.00% { opacity: 1; } 100.00% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a { animation: none; } }
  </style>
  <rect width="1000" height="470" rx="18" fill="url(#chevrons)"/>
  <g filter="url(#textShadow)"><text x="30" y="48" class="big">Is it safe to drop the enhancement layer?</text></g>
  
  <g transform="translate(30 0)">
    <rect x="0" y="70" width="290" height="380" rx="16" fill="#ffffff" opacity="0.16"/>
    <g filter="url(#textShadow)">
      <text x="20" y="108" class="mid">MEL</text>
      <text x="20" y="132" class="sub">The EL is almost empty.</text>
    </g>
    <line x1="20" y1="330" x2="270" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <rect class="a grow" style="animation-delay: 0.0s" x="70" y="200" width="70" height="130" rx="6" fill="#4c8dff"/>
    
    <text x="105" y="350" class="small" text-anchor="middle">BL peak</text>
    <g class="a verdict" style="animation-delay: 0.0s">
      <rect x="20" y="368" width="250" height="32" rx="16" fill="#1e9e57"/>
      <text x="145" y="390" class="tag" text-anchor="middle">Converted</text>
    </g>
    <g filter="url(#textShadow)"><text x="145" y="428" class="small" text-anchor="middle">Nothing visible is lost.</text></g>
  </g>
  
  <g transform="translate(355 0)">
    <rect x="0" y="70" width="290" height="380" rx="16" fill="#ffffff" opacity="0.16"/>
    <g filter="url(#textShadow)">
      <text x="20" y="108" class="mid">Simple FEL</text>
      <text x="20" y="132" class="sub">Picture data, no extra brightness.</text>
    </g>
    <line x1="20" y1="330" x2="270" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <rect class="a grow" style="animation-delay: 0.6s" x="70" y="200" width="70" height="130" rx="6" fill="#4c8dff"/>
    
    <text x="105" y="350" class="small" text-anchor="middle">BL peak</text>
    <g class="a verdict" style="animation-delay: 0.6s">
      <rect x="20" y="368" width="250" height="32" rx="16" fill="#d35400"/>
      <text x="145" y="390" class="tag" text-anchor="middle">Converted if you turn it on</text>
    </g>
    <g filter="url(#textShadow)"><text x="145" y="428" class="small" text-anchor="middle">Settings › Conversion › Include Simple FEL</text></g>
  </g>
  
  <g transform="translate(680 0)">
    <rect x="0" y="70" width="290" height="380" rx="16" fill="#ffffff" opacity="0.16"/>
    <g filter="url(#textShadow)">
      <text x="20" y="108" class="mid">Complex FEL</text>
      <text x="20" y="132" class="sub">The EL makes the picture brighter.</text>
    </g>
    <line x1="20" y1="330" x2="270" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <rect class="a grow" style="animation-delay: 1.2s" x="70" y="230" width="70" height="100" rx="6" fill="#4c8dff"/>
    <rect class="a extra" style="animation-delay: 1.2s" x="70" y="160" width="70" height="70" rx="6" fill="#ffffff" opacity="0.9"/><text class="a extra small" style="animation-delay: 1.2s" x="150" y="200.0">+ EL brightness</text>
    <text x="105" y="350" class="small" text-anchor="middle">BL peak</text>
    <g class="a verdict" style="animation-delay: 1.2s">
      <rect x="20" y="368" width="250" height="32" rx="16" fill="#c0392b"/>
      <text x="145" y="390" class="tag" text-anchor="middle">Skipped</text>
    </g>
    <g filter="url(#textShadow)"><text x="145" y="428" class="small" text-anchor="middle">Converting would lose that brightness.</text></g>
  </g>
</svg>
